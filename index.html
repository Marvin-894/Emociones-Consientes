    async function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }
    }

    // Sintetizador con envolventes suaves para polifonía de acordes
    function playChordTone(freq, duration, type = 'sine', gainVal = 0.03, delay = 0) {
        if (!freq || !audioCtx) return;
        
        setTimeout(() => {
            if (!audioCtx || audioCtx.state === 'closed') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(type === 'sawtooth' ? 600 : 1200, audioCtx.currentTime);

            // Envolvente suave de ataque y caída (ADSR simplificado)
            gainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(gainVal, audioCtx.currentTime + 0.2); 
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }, delay * 1000);
    }

    function playStep() {
        const style = styles[currentStyle];
        const chordIndex = Math.floor(step / 4) % style.chords.length;
        const currentChord = style.chords[chordIndex];

        // 1. Disparar el acorde completo con micro-arpegio (Staggered strumming)
        if (step % 4 === 0) {
            currentChord.forEach((note, idx) => {
                // Pequeño retardo entre notas para simular rasgueado/pulsación natural
                const staggerDelay = idx * 0.04; 
                playChordTone(note, 3.2, style.wave, 0.035, staggerDelay);
            });
        } 
        // 2. Arpegiado sutil en pasos intermedios usando notas del mismo acorde
        else if (step % 2 === 0) {
            const arpeggioNote = currentChord[step % currentChord.length];
            playChordTone(arpeggioNote * 2, 1.2, 'sine', 0.02, 0);
        }

        // 3. Melodía principal
        const melodyNote = style.melody[step % style.melody.length];
        if (melodyNote) {
            playChordTone(melodyNote, 1.0, 'sine', 0.045, 0);
        }

        step++;
    }

    async function toggleAudio() {
        await initAudio();
        const btn = document.getElementById('playAudioBtn');
        if (isPlaying) {
            clearInterval(timerId);
            isPlaying = false;
            btn.innerText = 'Reproducir Música 🎵';
            btn.classList.remove('active');
        } else {
            isPlaying = true;
            step = 0;
            btn.innerText = 'Pausar Música ⏸️';
            btn.classList.add('active');
            playStep();
            timerId = setInterval(playStep, styles[currentStyle].tempo);
        }
    }

    function changeStyle() {
        currentStyle = document.getElementById('styleSelect').value;
        if (isPlaying) {
            clearInterval(timerId);
            step = 0;
            timerId = setInterval(playStep, styles[currentStyle].tempo);
        }
    }

    function createWhiteNoiseBuffer() {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        return buffer;
    }

    async function toggleAmbientNoise(type, active) {
        await initAudio();
        if (!active) {
            if (ambientNodes[type]) {
                if (ambientNodes[type].gain) {
                    ambientNodes[type].gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                }
                setTimeout(() => {
                    try { 
                        if (ambientNodes[type] && ambientNodes[type].source) ambientNodes[type].source.stop();
                        if (ambientNodes[type] && ambientNodes[type].interval) clearInterval(ambientNodes[type].interval);
                    } catch(e){}
                    ambientNodes[type] = null;
                }, 500);
            }
            return;
        }

        const volSlider = document.getElementById(type + 'Vol');
        const targetGain = parseFloat(volSlider.value) * getBaseGain(type);

        if (type === 'birds') {
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(targetGain, audioCtx.currentTime);
            gain.connect(audioCtx.destination);

            const birdInterval = setInterval(() => {
                if (Math.random() > 0.4 && audioCtx) {
                    const osc = audioCtx.createOscillator();
                    const birdGain = audioCtx.createGain();
                    osc.type = 'sine';
                    const startFreq = 2000 + Math.random() * 1500;
                    osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(startFreq + 800, audioCtx.currentTime + 0.1);
                    birdGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                    birdGain.gain.linearRampToValueAtTime(0.05 * targetGain, audioCtx.currentTime + 0.05);
                    birdGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.connect(birdGain);
                    birdGain.connect(gain);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }
            }, 800);

            ambientNodes[type] = { source: null, gain: gain, interval: birdInterval };
            return;
        }

        const buffer = createWhiteNoiseBuffer();
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        noiseSource.loop = true;
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        if (type === 'rain') { filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, audioCtx.currentTime); }
        else if (type === 'ocean') { filter.type = 'bandpass'; filter.frequency.setValueAtTime(400, audioCtx.currentTime); filter.Q.value = 1.0; }
        else if (type === 'fire') { filter.type = 'bandpass'; filter.frequency.setValueAtTime(800, audioCtx.currentTime); filter.Q.value = 1.0; }
        else if (type === 'night') { filter.type = 'highpass'; filter.frequency.setValueAtTime(4000, audioCtx.currentTime); }
        else if (type === 'wind') { filter.type = 'bandpass'; filter.frequency.setValueAtTime(250, audioCtx.currentTime); filter.Q.value = 3.0; }
        else if (type === 'river') { filter.type = 'lowpass'; filter.frequency.setValueAtTime(600, audioCtx.currentTime); }
        else if (type === 'storm') { filter.type = 'lowpass'; filter.frequency.setValueAtTime(180, audioCtx.currentTime); }

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 0.5);
        noiseSource.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noiseSource.start();
        ambientNodes[type] = { source: noiseSource, gain: gain };
    }

    function getBaseGain(type) {
        switch(type) {
            case 'rain': return 0.15;
            case 'ocean': return 0.2;
            case 'fire': return 0.1;
            case 'night': return 0.05;
            case 'wind': return 0.25;
            case 'river': return 0.18;
            case 'birds': return 0.8;
            case 'storm': return 0.3;
            default: return 0.1;
        }
    }

    function updateVolume(type, val) {
        if (ambientNodes[type] && ambientNodes[type].gain && audioCtx) {
            const targetGain = parseFloat(val) * getBaseGain(type);
            ambientNodes[type].gain.gain.setValueAtTime(targetGain, audioCtx.currentTime);
        }
    }

    let mediaRecorder;
    let audioChunks = [];
    let selectedEmotionValue = '';
    let currentBase64Audio = '';
    let currentBase64Photo = '';

    function selectEmotion(emotion, message, element) {
        selectedEmotionValue = emotion;
        document.querySelectorAll('.buttons-grid .btn').forEach(btn => btn.classList.remove('selected'));
        if(element) element.classList.add('selected');

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'es-AR';
            window.speechSynthesis.speak(utterance);
        }
    }

    function previewPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
                currentBase64Photo = reader.result;
                const imgPreview = document.getElementById('photoPreviewImg');
                imgPreview.src = currentBase64Photo;
                imgPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function saveStandalonePhoto() {
        if (!currentBase64Photo) {
            alert('Primero selecciona una foto para guardar.');
            return;
        }
        const photoEmotion = document.getElementById('photoEmotionSelect').value;
        const entry = {
            emotion: photoEmotion,
            note: 'Foto guardada',
            photo: currentBase64Photo,
            audio: '',
            date: new Date().toLocaleString()
        };
        let entries = JSON.parse(localStorage.getItem('emotionEntries')) || [];
        entries.push(entry);
        localStorage.setItem('emotionEntries', JSON.stringify(entries));
        alert('¡Foto guardada con éxito! 🖼️');
        
        document.getElementById('photoInput').value = '';
        document.getElementById('photoPreviewImg').style.display = 'none';
        currentBase64Photo = '';
        loadEntries();
    }

    async function toggleRecording() {
        const recordBtn = document.getElementById('recordBtn');
        const audioPlayback = document.getElementById('audioPlayback');

        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            recordBtn.innerText = 'Grabar Audio';
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        currentBase64Audio = reader.result;
                        audioPlayback.src = currentBase64Audio;
                        audioPlayback.style.display = 'block';
                    };
                };

                mediaRecorder.start();
                recordBtn.innerText = 'Detener Grabación ⏹️';
            } catch (err) {
                alert('No se pudo acceder al micrófono.');
                recordBtn.innerText = 'Grabar Audio';
            }
        }
    }

    function saveEntry() {
        const noteInput = document.getElementById('noteInput');
        const entry = {
            emotion: selectedEmotionValue || 'No especificada',
            note: noteInput.value,
            photo: currentBase64Photo,
            audio: currentBase64Audio,
            date: new Date().toLocaleString()
        };
        let entries = JSON.parse(localStorage.getItem('emotionEntries')) || [];
        entries.push(entry);
        localStorage.setItem('emotionEntries', JSON.stringify(entries));
        alert('¡Registro guardado con éxito! 🎉');
        
        noteInput.value = '';
        document.getElementById('photoInput').value = '';
        document.getElementById('photoPreviewImg').style.display = 'none';
        document.getElementById('audioPlayback').style.display = 'none';
        document.querySelectorAll('.buttons-grid .btn').forEach(btn => btn.classList.remove('selected'));
        selectedEmotionValue = '';
        currentBase64Audio = '';
        currentBase64Photo = '';
        
        loadEntries();
    }

    function saveGratitude() {
        const gratitudeInput = document.getElementById('gratitudeInput');

        gratitudeInput.value = '';
        loadGratitude();
    }

        let observations = JSON.parse(localStorage.getItem('microexpressionEntries')) || [];

        localStorage.setItem('microexpressionEntries', JSON.stringify(observations));

    function deleteItem(storageKey, index) {
        let items = JSON.parse(localStorage.getItem(storageKey)) || [];
        items.splice(index, 1);
        localStorage.setItem(storageKey, JSON.stringify(items));
        
        if (storageKey === 'emotionEntries') loadEntries();
        if (storageKey === 'gratitudeEntries') loadGratitude();
        if (storageKey === 'strategyEntries') loadStrategies();
        if (storageKey === 'microexpressionEntries') loadMicroexpressions();
    }

    function loadEntries() {
        const list = document.getElementById('entriesList');
        list.innerHTML = '';
        let entries = JSON.parse(localStorage.getItem('emotionEntries')) || [];
        entries.forEach((item, index) => {
            const li = document.createElement('li');
            let content = `<strong>${item.date}</strong> - Emoción: ${item.emotion}<br>${item.note}`;
            if (item.photo) content += `<br><img src="${item.photo}" class="entry-img">`;
            if (item.audio) content += `<br><audio src="${item.audio}" controls style="margin-top:8px; width:100%;"></audio>`;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-delete';
            deleteBtn.innerText = 'Eliminar';
            deleteBtn.onclick = () => deleteItem('emotionEntries', index);
            
            li.innerHTML = content;
            li.appendChild(deleteBtn);
            list.appendChild(li);
        });
    }

    function loadGratitude() {
        const list = document.getElementById('gratitudeList');
        list.innerHTML = '';
        let items = JSON.parse(localStorage.getItem('gratitudeEntries')) || [];
        items.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${item.date}</strong>: ${item.text}`;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-delete';
            deleteBtn.innerText = 'Eliminar';
            deleteBtn.onclick = () => deleteItem('gratitudeEntries', index);
            
            li.appendChild(deleteBtn);
            list.appendChild(li);
        });
    }

        const list = document.getElementById('strategyList');

        items.forEach((item, index) => {
            const li = document.createElement('li');

            list.appendChild(li);

    }

    window.onload = () => {
        loadEntries();
        loadGratitude();
        loadStrategies();
        loadMicroexpressions();
    };
