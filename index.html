function getStorage(key) {
    try {
        const value = localStorage.getItem(key);

        if (!value) return [];

        const parsed = JSON.parse(value);

        return Array.isArray(parsed) ? parsed : [];

    } catch (error) {
        console.error('Error leyendo almacenamiento:', error);
        return [];
    }
}

function setStorage(key, data) {
    try {
        localStorage.setItem(key, JSON.stringify(data));
        return true;

    } catch (error) {
        console.error('Error guardando datos:', error);

        alert(
            'No se pudieron guardar los datos. ' +
            'Es posible que el almacenamiento de la app esté lleno.'
        );

        return false;
    }
}


/* =========================

function getEntryDate(entry) {

    if (entry.timestamp) {
        const date = new Date(entry.timestamp);

        if (!isNaN(date.getTime())) {
            return date;
        }
    }

    if (entry.date) {
        const date = new Date(entry.date);

        if (!isNaN(date.getTime())) {
            return date;
        }
    }

    return null;
}

function isWithinLast7Days(entry) {

    const date = getEntryDate(entry);

    if (!date) return false;

    const now = new Date();

    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(now.getDate() - 6);
    sevenDaysAgo.setHours(0, 0, 0, 0);

    return date >= sevenDaysAgo && date <= now;
}

function formatDate(date = new Date()) {

    return date.toLocaleString('es-AR', {
        dateStyle: 'short',
        timeStyle: 'short'
    });
}

async function initAudio() {

    try {

        if (!audioCtx) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                alert('Este dispositivo no permite reproducir audio.');
                return false;
            }

            audioCtx = new AudioContext();
        }

        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        return true;

    } catch (error) {

        console.error('Error inicializando audio:', error);

        alert('No se pudo iniciar el sistema de audio.');

        return false;
    }
}


function playTone(
    freq,
    duration,
    type = 'sine',
    gainVal = 0.05
) {

    if (!freq || !audioCtx) return;

    try {

        const osc = audioCtx.createOscillator();

        const gainNode = audioCtx.createGain();

        const filter = audioCtx.createBiquadFilter();

        osc.type = type;

        osc.frequency.setValueAtTime(
            freq,
            audioCtx.currentTime
        );

        filter.type = 'lowpass';

        filter.frequency.setValueAtTime(
            1600,
            audioCtx.currentTime
        );

        gainNode.gain.setValueAtTime(
            0.001,
            audioCtx.currentTime
        );

        gainNode.gain.linearRampToValueAtTime(
            gainVal,
            audioCtx.currentTime + 0.05
        );

        gainNode.gain.exponentialRampToValueAtTime(
            0.0001,
            audioCtx.currentTime + duration
        );

        osc.connect(filter);

        filter.connect(gainNode);

        gainNode.connect(audioCtx.destination);

        osc.start();

        osc.stop(
            audioCtx.currentTime + duration
        );

    } catch (error) {
        console.error('Error reproduciendo tono:', error);
    }
}


function playStep() {

    if (!isPlaying) return;

    const style = styles[currentStyle];

    if (!style) return;

    const chordIndex =
        Math.floor(step / 4) %
        style.chords.length;

    if (step % 4 === 0) {

        style.chords[chordIndex].forEach(note => {

            playTone(
                note,
                2.5,
                style.wave,
                0.025
            );

        });
    }

    const melodyNote =
        style.melody[
            step % style.melody.length
        ];

    if (melodyNote) {

        playTone(
            melodyNote,
            0.8,
            'sine',
            0.035
        );
    }

    step++;
}


function stopMusicTimer() {

    if (timerId) {

        clearInterval(timerId);

        timerId = null;
    }
}


function startMusicTimer() {

    stopMusicTimer();

    timerId = setInterval(
        playStep,
        styles[currentStyle].tempo
    );
}


function startAutoSwitchTimer() {

    stopAutoSwitchTimer();

    autoSwitchInterval =
        setInterval(() => {

            if (isPlaying) {
                skipToNextStyle();
            }

        }, 120000);
}


function stopAutoSwitchTimer() {

    if (autoSwitchInterval) {

        clearInterval(autoSwitchInterval);

        autoSwitchInterval = null;
    }
}


async function toggleAudio() {

    const initialized = await initAudio();

    if (!initialized) return;

    const btn =
        document.getElementById('playAudioBtn');

    if (isPlaying) {

        isPlaying = false;

        stopMusicTimer();

        stopAutoSwitchTimer();

        btn.innerText =
            'Reproducir Música 🎵';

        btn.classList.remove('active');

    } else {

        isPlaying = true;

        step = 0;

        btn.innerText =
            'Pausar Música ⏸️';

        btn.classList.add('active');

        playStep();

        startMusicTimer();

        startAutoSwitchTimer();
    }
}


function skipToNextStyle() {

    const select =
        document.getElementById('styleSelect');

    const keys =
        Object.keys(styles);

    const currentIndex =
        keys.indexOf(currentStyle);

    const nextIndex =
        (currentIndex + 1) % keys.length;

    currentStyle =
        keys[nextIndex];

    if (select) {
        select.value = currentStyle;
    }

    step = 0;

    if (isPlaying) {

        startMusicTimer();

        startAutoSwitchTimer();

        playStep();
    }
}


function changeStyleManual() {

    const select =
        document.getElementById('styleSelect');

    if (!select) return;

    currentStyle =
        select.value;

    step = 0;

    if (isPlaying) {

        startMusicTimer();

        playStep();
    }
}


/* =========================
   SONIDOS AMBIENTALES
   ========================= */

function createWhiteNoiseBuffer() {

    if (!audioCtx) return null;

    const bufferSize =
        audioCtx.sampleRate * 2;

    const buffer =
        audioCtx.createBuffer(
            1,
            bufferSize,
            audioCtx.sampleRate
        );

    const output =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        output[i] =
            Math.random() * 2 - 1;
    }

    return buffer;
}


function getBaseGain(type) {

    const gains = {

        rain: 0.15,
        ocean: 0.20,
        fire: 0.10,
        night: 0.05,
        wind: 0.25,
        river: 0.18,
        birds: 0.80,
        storm: 0.30

    };

    return gains[type] || 0.1;
}


async function toggleAmbientNoise(type, active) {

    const initialized =
        await initAudio();

    if (!initialized) return;

    if (!ambientNodes[type]) {
        ambientNodes[type] = null;
    }

    if (!active) {

        const node =
            ambientNodes[type];

        if (!node) return;

        if (node.interval) {

            clearInterval(node.interval);

            node.interval = null;
        }

        if (node.gain) {

            try {

                node.gain.gain.cancelScheduledValues(
                    audioCtx.currentTime
                );

                node.gain.gain.setTargetAtTime(
                    0.0001,
                    audioCtx.currentTime,
                    0.15
                );

            } catch (error) {}
        }

        setTimeout(() => {

            try {

                if (node.source) {
                    node.source.stop();
                    node.source.disconnect();
                }

                if (node.gain) {
                    node.gain.disconnect();
                }

            } catch (error) {}

            ambientNodes[type] = null;

        }, 500);

        return;
    }


    /* Pájaros */

    if (type === 'birds') {

        const gain =
            audioCtx.createGain();

        const volume =
            document.getElementById(
                'birdsVol'
            );

        const targetGain =
            parseFloat(volume?.value || 0.5) *
            getBaseGain(type);

        gain.gain.value =
            targetGain;

        gain.connect(
            audioCtx.destination
        );

        const birdInterval =
            setInterval(() => {

                if (!audioCtx) return;

                if (Math.random() > 0.4) {

                    try {

                        const osc =
                            audioCtx.createOscillator();

                        const birdGain =
                            audioCtx.createGain();

                        const startFreq =
                            2000 +
                            Math.random() * 1500;

                        osc.type = 'sine';

                        osc.frequency.setValueAtTime(
                            startFreq,
                            audioCtx.currentTime
                        );

                        osc.frequency.linearRampToValueAtTime(
                            startFreq + 800,
                            audioCtx.currentTime + 0.1
                        );

                        birdGain.gain.setValueAtTime(
                            0.001,
                            audioCtx.currentTime
                        );

                        birdGain.gain.linearRampToValueAtTime(
                            0.04,
                            audioCtx.currentTime + 0.05
                        );

                        birdGain.gain.exponentialRampToValueAtTime(
                            0.001,
                            audioCtx.currentTime + 0.2
                        );

                        osc.connect(birdGain);

                        birdGain.connect(gain);

                        osc.start();

                        osc.stop(
                            audioCtx.currentTime + 0.2
                        );

                    } catch (error) {}
                }

            }, 900);

        ambientNodes[type] = {
            source: null,
            gain: gain,
            interval: birdInterval
        };

        return;
    }


    /* Ruido */

    const buffer =
        createWhiteNoiseBuffer();

    if (!buffer) return;

    const noiseSource =
        audioCtx.createBufferSource();

    noiseSource.buffer =
        buffer;

    noiseSource.loop = true;

    const filter =
        audioCtx.createBiquadFilter();

    const gain =
        audioCtx.createGain();

    switch (type) {

        case 'rain':
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            break;

        case 'ocean':
            filter.type = 'bandpass';
            filter.frequency.value = 400;
            filter.Q.value = 1;
            break;

        case 'fire':
            filter.type = 'bandpass';
            filter.frequency.value = 800;
            filter.Q.value = 1;
            break;

        case 'night':
            filter.type = 'highpass';
            filter.frequency.value = 4000;
            break;

        case 'wind':
            filter.type = 'bandpass';
            filter.frequency.value = 250;
            filter.Q.value = 3;
            break;

        case 'river':
            filter.type = 'lowpass';
            filter.frequency.value = 600;
            break;

        case 'storm':
            filter.type = 'lowpass';
            filter.frequency.value = 180;
            break;
    }

    const slider =
        document.getElementById(
            type + 'Vol'
        );

    const targetGain =
        parseFloat(slider?.value || 0.5) *
        getBaseGain(type);

    gain.gain.setValueAtTime(
        0.001,
        audioCtx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        targetGain,
        audioCtx.currentTime + 0.3
    );

    noiseSource.connect(filter);

    filter.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    noiseSource.start();

    ambientNodes[type] = {
        source: noiseSource,
        gain: gain
    };
}


function updateVolume(type, value) {

    const node =
        ambientNodes[type];

    if (
        !node ||
        !node.gain ||
        !audioCtx
    ) return;

    const targetGain =
        parseFloat(value) *
        getBaseGain(type);

    try {

        node.gain.gain.setTargetAtTime(
            targetGain,
            audioCtx.currentTime,
            0.05
        );

    } catch (error) {}
}


/* =========================
   TEXTO A VOZ
   ========================= */

function speakText(text) {

    if (
        !text ||
        !('speechSynthesis' in window)
    ) return;

    try {

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = 'es-AR';

        utterance.rate = 0.9;

        utterance.pitch = 1;

        window.speechSynthesis.speak(
            utterance
        );

    } catch (error) {

        console.error(
            'Error en voz:',
            error
        );
    }
}

let currentBase64Photo = '';


function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload = event => {

                const img =
                    new Image();

                img.onload = () => {

                    const MAX_WIDTH = 1280;

                    let width =
                        img.width;

                    let height =
                        img.height;

                    if (
                        width >
                        MAX_WIDTH
                    ) {

                        height =
                            height *
                            MAX_WIDTH /
                            width;

                        width =
                            MAX_WIDTH;
                    }

                    const canvas =
                        document.createElement(
                            'canvas'
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas.getContext(
                            '2d'
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    resolve(
                        canvas.toDataURL(
                            'image/jpeg',
                            0.75
                        )
                    );
                };

                img.onerror =
                    reject;

                img.src =
                    event.target.result;
            };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


async function previewPhoto(event) {

    const file =
        event.target.files?.[0];

    if (!file) return;

    if (
        !file.type.startsWith(
            'image/'
        )
    ) {

        alert(
            'Selecciona una imagen válida.'
        );

        return;
    }

    try {

        currentBase64Photo =
            await compressImage(file);

        const img =
            document.getElementById(
                'photoPreviewImg'
            );

        img.src =
            currentBase64Photo;

        img.style.display =
            'block';

    } catch (error) {

        console.error(error);

        alert(
            'No se pudo procesar la imagen.'
        );
    }
}


/* =========================
   GRABACIÓN DE AUDIO
   ========================= */

let mediaRecorder = null;
let audioChunks = [];
let audioStream = null;
let currentBase64Audio = '';


async function toggleRecording() {

    const recordBtn =
        document.getElementById(
            'recordBtn'
        );

    const audioPlayback =
        document.getElementById(
            'audioPlayback'
        );


    /* DETENER */

    if (
        mediaRecorder &&
        mediaRecorder.state === 'recording'
    ) {

        mediaRecorder.stop();

        recordBtn.innerText =
            'Procesando audio...';

        return;
    }


    /* VERIFICAR SOPORTE */

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            'El micrófono no está disponible. ' +
            'Si estás usando la app desde Android, ' +
            'debes permitir el permiso del micrófono.'
        );

        return;
    }

    if (
        typeof MediaRecorder ===
        'undefined'
    ) {

        alert(
            'Este dispositivo no admite grabación de audio.'
        );

        return;
    }


    try {

        audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        let mimeType = '';

        const possibleTypes = [

            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/mp4',
            'audio/ogg;codecs=opus',
            'audio/ogg'

        ];

        for (
            const type of possibleTypes
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    type
                )
            ) {

                mimeType = type;
                break;
            }
        }

        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    audioStream,
                    { mimeType }
                )
                : new MediaRecorder(
                    audioStream
                );

        audioChunks = [];


        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            () => {

                try {

                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    'audio/webm'
                            }
                        );

                    const reader =
                        new FileReader();

                    reader.onloadend =
                        () => {

                            currentBase64Audio =
                                reader.result;

                            audioPlayback.src =
                                currentBase64Audio;

                            audioPlayback.style.display =
                                'block';

                            recordBtn.innerText =
                                'Grabar Audio';
                        };

                    reader.readAsDataURL(
                        blob
                    );

                } catch (error) {

                    console.error(error);

                    recordBtn.innerText =
                        'Grabar Audio';
                }


                if (audioStream) {

                    audioStream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                    audioStream =
                        null;
                }
            };


        mediaRecorder.onerror =
            () => {

                alert(
                    'Ocurrió un error durante la grabación.'
                );

                recordBtn.innerText =
                    'Grabar Audio';
            };


        mediaRecorder.start();

        recordBtn.innerText =

/* =========================
   SEGURIDAD PARA MOSTRAR TEXTO
   ========================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) return '';

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


/* =========================
   HISTORIAL
   ========================= */

function deleteItem(
    storageKey,
    index
) {

    const items =
        getStorage(storageKey);

    if (
        index < 0 ||
        index >= items.length
    ) return;


    if (
        !confirm(
            '¿Seguro que deseas eliminar este registro?'
        )
    ) return;


    items.splice(
        index,
        1
    );

    if (
        !setStorage(
            storageKey,
            items
        )
    ) return;


    switch (storageKey) {

        case 'emotionEntries':
            loadEntries();
            updateWeeklyChart();
            break;

        case 'gratitudeEntries':
            loadGratitude();
            break;

        case 'strategyEntries':
            loadStrategies();
            break;

        case 'microexpressionEntries':
            loadMicroexpressions();
            break;

        case 'archivedWeeks':
            loadArchives();
            break;
    }
}

/* =========================
   RENDERIZADO DE LISTAS
   ========================= */

function renderList(
    listId,
    storageKey,
    createContentFn
) {

    const list =
        document.getElementById(
            listId
        );

    if (!list) return;

    list.innerHTML = '';

    const items =
        getStorage(storageKey);


    if (items.length === 0) {

        const empty =
            document.createElement(
                'li'
            );

        empty.innerText =
            'Todavía no hay registros.';

        list.appendChild(
            empty
        );

        return;
    }


    items
        .slice()
        .reverse()
        .forEach(
            (item, reverseIndex) => {

                const realIndex =
                    items.length -
                    1 -
                    reverseIndex;

                const li =
                    document.createElement(
                        'li'
                    );

                li.innerHTML =
                    createContentFn(
                        item
                    );


                const deleteBtn =
                    document.createElement(
                        'button'
                    );

                deleteBtn.className =
                    'btn-delete';

                deleteBtn.innerText =
                    'Eliminar';

                deleteBtn.type =
                    'button';

                deleteBtn.onclick =
                    () =>
                        deleteItem(
                            storageKey,
                            realIndex
                        );


                li.appendChild(
                    deleteBtn
                );

                list.appendChild(
                    li
                );
            }
        );
}

/* =========================
   GRÁFICO SEMANAL
   ========================= */

function updateWeeklyChart() {

    const chartContainer =
        document.getElementById(
            'weeklyChart'
        );

    const summaryBox =
        document.getElementById(
            'weeklySummary'
        );


    if (
        !chartContainer ||
        !summaryBox
    ) return;


    chartContainer.innerHTML = '';


    const allEntries =
        getStorage(
            'emotionEntries'
        );


    const entries =
        allEntries.filter(
            isWithinLast7Days
        );


    if (entries.length === 0) {

        chartContainer.innerHTML =
            '<p style="margin:auto;">' +
            'No hay registros emocionales de los últimos 7 días.' +
            '</p>';

        summaryBox.innerText =
            'Registra tus emociones para generar el balance semanal.';

        return;
    }


    const emotionCounts = {};


    entries.forEach(entry => {

        if (
            entry.emotion &&
            entry.emotion !==
                'No especificada'
        ) {

            emotionCounts[
                entry.emotion
            ] =
                (
                    emotionCounts[
                        entry.emotion
                    ] || 0
                ) + 1;
        }
    });


    const total =
        Object.values(
            emotionCounts
        ).reduce(
            (a, b) => a + b,
            0
        );


    if (total === 0) {

        summaryBox.innerText =
            'No hay emociones registradas esta semana.';

        return;
    }


    let maxEmotion = '';

    let maxCount = 0;


    Object.entries(
        emotionCounts
    ).forEach(
        ([emotion, count]) => {

            if (
                count >
                maxCount
            ) {

                maxCount =
                    count;

                maxEmotion =
                    emotion;
            }
        }
    );


    Object.entries(
        emotionCounts
    ).forEach(
        ([emotion, count]) => {

            const heightPct =
                Math.max(
                    5,
                    (count / total) *
                        100
                );


            const wrapper =
                document.createElement(
                    'div'
                );

            wrapper.className =
                'chart-bar-wrapper';


            const bar =
                document.createElement(
                    'div'
                );

            bar.className =
                'chart-bar';

            bar.style.height =
                `${heightPct}%`;

            bar.title =
                `${emotion}: ${count}`;


            const label =
                document.createElement(
                    'span'
                );

            label.className =
                'chart-label';

            label.innerText =
                emotion.substring(
                    0,
                    5
                );


            wrapper.appendChild(
                bar
            );

            wrapper.appendChild(
                label
            );

            chartContainer.appendChild(
                wrapper
            );
        }
    );


    const dominantPct =
        Math.round(
            (maxCount / total) *
                100
        );


    summaryBox.innerHTML =
        `Estado dominante: <strong>` +
        `${escapeHTML(maxEmotion)}` +
        `</strong> (${dominantPct}%). ` +
        `Registros de los últimos 7 días: ${total}.`;
}

            ),

/* =========================
   EXPORTAR DATOS
   ========================= */

function exportDataJSON() {

    const data = {

        version: 2,

        exportedAt:
            new Date().toISOString(),

        emotionEntries:
            getStorage(
                'emotionEntries'
            ),

        gratitudeEntries:
            getStorage(
                'gratitudeEntries'
            ),

        strategyEntries:
            getStorage(
                'strategyEntries'
            ),

        microexpressionEntries:
            getStorage(
                'microexpressionEntries'
            ),

        archivedWeeks:
            getStorage(
                'archivedWeeks'
            )
    };


    try {

        const jsonText =
            JSON.stringify(
                data,
                null,
                2
            );

        const blob =
            new Blob(
                [jsonText],
                {
                    type:
                        'application/json;charset=utf-8'
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const anchor =
            document.createElement(
                'a'
            );

        anchor.href =
            url;

        anchor.download =
            `respaldo_diario_${
                new Date()
                    .toISOString()
                    .slice(0, 10)
            }.json`;

        document.body.appendChild(
            anchor
        );

        anchor.click();

        document.body.removeChild(
            anchor
        );

        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            1000
        );

    } catch (error) {

        console.error(error);

        alert(
            'No se pudo crear el respaldo.'
        );
    }
}


/* =========================
   IMPORTAR DATOS
   ========================= */

function importDataJSON(event) {

    const file =
        event.target.files?.[0];

    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function (e) {

            try {

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !imported ||
                    typeof imported !==
                        'object'
                ) {

                    throw new Error(
                        'Formato inválido'
                    );
                }


                if (
                    !confirm(
                        'Esto reemplazará los datos actuales. ¿Deseas continuar?'
                    )
                ) {

                    event.target.value =
                        '';

                    return;
                }


                const keys = [

                    'emotionEntries',
                    'gratitudeEntries',
                    'strategyEntries',
                    'microexpressionEntries',
                    'archivedWeeks'

                ];


                keys.forEach(
                    key => {

                        if (
                            Array.isArray(
                                imported[key]
                            )
                        ) {

                            setStorage(
                                key,
                                imported[key]
                            );
                        }

                    }
                );


                loadEntries();

                loadGratitude();

                loadStrategies();

                loadMicroexpressions();

                loadArchives();

                updateWeeklyChart();


                alert(
                    '¡Datos importados con éxito! 📤'
                );


            } catch (error) {

                console.error(
                    'Importación:',
                    error
                );

                alert(
                    'El archivo JSON no es válido.'
                );

            } finally {

                event.target.value =
                    '';
            }
        };


    reader.onerror =
        () => {

            alert(
                'No se pudo leer el archivo.'
            );

            event.target.value =
                '';
        };


    reader.readAsText(
        file
    );
}


/* =========================
   SOS 4-7-8
   ========================= */

let breathInterval = null;
let breathTimeout = null;


function stopBreathing() {

    if (breathInterval) {

        clearInterval(
            breathInterval
        );

        breathInterval =
            null;
    }

    if (breathTimeout) {

        clearTimeout(
            breathTimeout
        );

        breathTimeout =
            null;
    }
}


function openSOSModal() {

    const modal =
        document.getElementById(
            'sosModal'
        );

    if (!modal) return;


    stopBreathing();


    modal.style.display =
        'flex';


    const circle =
        document.getElementById(
            'breathCircle'
        );

    const timer =
        document.getElementById(
            'breathTimer'
        );

    if (circle) {
        circle.innerText = '4-7-8';
        circle.style.transition = 'transform 1s ease-in-out';
        circle.style.transform = 'scale(1)';
    }

    if (timer) {
        timer.innerText = '';
    }

    speakText(
        'Vamos a hacer la técnica de respiración 4-7-8. ' +
        'Primero vamos a inhalar por la nariz durante cuatro segundos. ' +
        'Después mantené el aire durante siete segundos. ' +
        'Finalmente, exhalá lentamente por la boca durante ocho segundos. ' +
        'Vamos a comenzar.'
    );

    breathTimeout =
        setTimeout(
            startBreathCycle,
            14000
        );
}


function closeSOSModal() {

    const modal =
        document.getElementById(
            'sosModal'
        );

    if (modal) {

        modal.style.display =
            'none';
    }


    stopBreathing();


    const circle =
        document.getElementById(
            'breathCircle'
        );

    const timer =
        document.getElementById(
            'breathTimer'
        );


    if (circle) {

        circle.style.transform =
            'scale(1)';

        circle.innerText =
            'Inhala';
    }


    if (timer) {

        timer.innerText =
            '4';
    }


    if (
        'speechSynthesis' in window
    ) {

        window.speechSynthesis.cancel();
    }
}


function startBreathCycle() {

    stopBreathing();

    const circle = document.getElementById('breathCircle');
    const timer = document.getElementById('breathTimer');

    if (!circle || !timer) return;

    let phase = 0;
    let count = 4;

    function runStep() {
        if (phase === 0) {
            circle.innerText = 'Inhala';
            circle.style.transition = 'transform 4s ease-in-out';
            circle.style.transform = 'scale(1.4)';

            speakText(`Inhalá... ${count}...`);
            timer.innerText = count;

            breathInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    timer.innerText = count;
                    speakText(`${count}...`);
                } else {
                    clearInterval(breathInterval);
                    phase = 1;
                    count = 7;
                    runStep();
                }
            }, 1000);

        } else if (phase === 1) {
            circle.innerText = 'Mantén';
            circle.style.transition = 'none';
            circle.style.transform = 'scale(1.4)';

            speakText(`Mantené... ${count}...`);
            timer.innerText = count;

            breathInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    timer.innerText = count;
                    speakText(`${count}...`);
                } else {
                    clearInterval(breathInterval);
                    phase = 2;
                    count = 8;
                    runStep();
                }
            }, 1000);

        } else if (phase === 2) {
            circle.innerText = 'Exhala';
            circle.style.transition = 'transform 8s ease-in-out';
            circle.style.transform = 'scale(1)';

            speakText(`Exhalá lentamente... ${count}...`);
            timer.innerText = count;

            breathInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    timer.innerText = count;
                    speakText(`${count}...`);
                } else {
                    clearInterval(breathInterval);
                    phase = 0;
                    count = 4;
                    runStep();
                }
            }, 1000);
        }
    }

    runStep();
}

window.addEventListener(
    'beforeunload',
    () => {

        stopMusicTimer();

        stopAutoSwitchTimer();

        stopBreathing();


        if (audioStream) {

            audioStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        Object.keys(
            ambientNodes
        ).forEach(
            type => {

                const node =
                    ambientNodes[type];

                if (!node) return;

                if (node.interval) {

                    clearInterval(
                        node.interval
                    );
                }

                try {

                    if (node.source) {
                        node.source.stop();
                    }

                } catch (error) {}
            }
        );
    }
);

</script>
