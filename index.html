/* ARQUITECTURA DE AUDIO DE ALTA FIDELIDAD */
async function initAudio(){
    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterBus = audioCtx.createGain();
        musicBus = audioCtx.createGain();
        reverbBus = audioCtx.createGain();

        masterBus.gain.value = parseFloat(document.getElementById('masterVolume').value);
        musicBus.gain.value = 0.7;
        reverbBus.gain.value = 0.25;

        musicBus.connect(masterBus);
        reverbBus.connect(masterBus);
        masterBus.connect(audioCtx.destination);

        createReverbImpulse();
    }
    if(audioCtx.state === 'suspended'){
        await audioCtx.resume();
    }
}

// Generador de respuesta al impulso para Reverb de alta calidad
function createReverbImpulse(){
    const length = audioCtx.sampleRate * 3.0;
    const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
    for(let c = 0; c < 2; c++){
        const channelData = impulse.getChannelData(c);
        for(let i = 0; i < length; i++){
            channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.2);
        }
    }
    const convolver = audioCtx.createConvolver();
    convolver.buffer = impulse;
    reverbBus.connect(convolver);
    convolver.connect(masterBus);
}

/* SINTETIZADORES DE INSTRUMENTOS NATIVOS */
function playPianoNote(freq, dur = 1.2, vol = 0.08){
    if(!freq || !audioCtx) return;
    const now = audioCtx.currentTime;
    
    // Oscilador Principal (Fundamental)
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(freq, now);

    // Armónico metálico de cuerda martillada
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(freq * 2, now);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2800, now);
    filter.frequency.exponentialRampToValueAtTime(400, now + dur);

    // Envolvente Piano ADSR
    gain1.gain.setValueAtTime(0.001, now);
    gain1.gain.linearRampToValueAtTime(vol, now + 0.01);
    gain1.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    gain2.gain.setValueAtTime(0.001, now);
    gain2.gain.linearRampToValueAtTime(vol * 0.25, now + 0.005);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now + (dur * 0.4));

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain1);
    gain1.connect(musicBus);
    gain1.connect(reverbBus);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + dur + 0.05);
    osc2.stop(now + dur + 0.05);
}

function playAcousticPluck(freq, dur = 0.8, vol = 0.07){
    if(!freq || !audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3500, now);
    filter.frequency.exponentialRampToValueAtTime(200, now + (dur * 0.6));

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(musicBus);
    gain.connect(reverbBus);

    osc.start(now);
    osc.stop(now + dur + 0.05);
}

function playPadSynth(freqs, dur = 4.0, vol = 0.03){
    if(!freqs || !audioCtx) return;
    const now = audioCtx.currentTime;

    freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        osc.detune.setValueAtTime((idx % 2 === 0 ? 5 : -5), now); // Detune suave para calidez

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200 + (idx * 200), now);

        // Envolvente de colchón ambiental
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 1.2);
        gain.gain.setValueAtTime(vol, now + (dur * 0.7));
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur + 1.5);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(musicBus);
        gain.connect(reverbBus);

        osc.start(now);
        osc.stop(now + dur + 1.6);
    });
}

function playBass(freq, dur = 0.5, vol = 0.09, styleType = 'standard'){
    if(!freq || !audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = styleType === 'synthwave' ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(styleType === 'synthwave' ? 1200 : 600, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(musicBus);

    osc.start(now);
    osc.stop(now + dur + 0.05);
}

/* PERCUSIÓN SINTETIZADA NATIVA */
function playKick(vol = 0.08){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(130, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.12);

    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

    osc.connect(gain);
    gain.connect(musicBus);
    osc.start(now);
    osc.stop(now + 0.16);
}

function playSnare(vol = 0.03){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;

    // Cuerpo de caja (tono)
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    oscGain.gain.setValueAtTime(vol * 0.8, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

    // Entorchado de caja (ruido)
    const bufLen = audioCtx.sampleRate * 0.12;
    const buffer = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);

    const noise = audioCtx.createBufferSource();
    const noiseFilter = audioCtx.createBiquadFilter();
    const noiseGain = audioCtx.createGain();

    noise.buffer = buffer;
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 1000;

    noiseGain.gain.setValueAtTime(vol, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

    osc.connect(oscGain);
    oscGain.connect(musicBus);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(musicBus);

    osc.start(now);
    noise.start(now);
    osc.stop(now + 0.11);
}

function playHiHat(vol = 0.015){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufLen = audioCtx.sampleRate * 0.05;
    const buffer = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);

    const noise = audioCtx.createBufferSource();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    noise.buffer = buffer;
    filter.type = 'highpass';
    filter.frequency.value = 6500;

    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(musicBus);
    noise.start(now);
}

/* MOTOR DESECUENCIACIÓN MUSICAL */
function playMusicStep(){
    if(!audioCtx || !isPlaying) return;

    const style = styles[currentStyle];
    const beat = step % 16;
    const chordIndex = Math.floor(step / 16) % style.chords.length;
    const chord = style.chords[chordIndex];

    // 1. Armonía (Acordes y Colchones)
    if(beat === 0){
        if(style.type === 'piano' || style.type === 'jazz' || style.type === 'lofi'){
            chord.forEach((note, i) => {
                setTimeout(() => playPianoNote(note, 2.5, 0.05 - (i * 0.005)), i * 25);
            });
        } else if(style.type === 'folk' || style.type === 'bossa'){
            chord.forEach((note, i) => {
                setTimeout(() => playAcousticPluck(note, 1.8, 0.04), i * 35);
            });
        } else {
            playPadSynth(chord, 3.8, 0.025);
        }
    }

    // 2. Línea de Bajo
    const bassNote = style.bass[beat % style.bass.length];
    if(bassNote){
        playBass(bassNote, 0.45, 0.08, style.type);
    }

    // 3. Melodía Lead
    const melodyIndex = Math.floor(beat / 2) % style.melody.length;
    const melodyNote = style.melody[melodyIndex];
    
    if(beat % 2 === 0 && melodyNote){
        // Inserción de variaciones musicales dinámicas
        let noteToPlay = melodyNote;
        if(variation % 2 === 1 && Math.random() > 0.4){
            noteToPlay = melodyNote * 1.25; // Modulación tonal en variaciones
        }

        if(style.type === 'piano' || style.type === 'jazz'){
            playPianoNote(noteToPlay, 0.8, 0.06);
        } else if(style.type === 'folk' || style.type === 'bossa'){
            playAcousticPluck(noteToPlay, 0.7, 0.05);
        } else {
            playAcousticPluck(noteToPlay, 1.0, 0.03);
        }
    }

    // 4. Ritmo y Percusión según el Género
    if(style.type === 'lofi' || style.type === 'bossa' || style.type === 'synthwave' || style.type === 'reggae'){
        if(beat === 0 || beat === 8 || (style.type === 'synthwave' && beat === 10)){
            playKick(style.type === 'synthwave' ? 0.09 : 0.06);
        }
        if(beat === 4 || beat === 12){
            playSnare(0.035);
        }
        if(beat % 2 === 0){
            playHiHat(0.012);
        }
    } else if(style.type === 'jazz'){
        if(beat % 4 === 2 || beat % 4 === 3){
            playHiHat(0.01);
        }
    }

    step++;
    if(step % 64 === 0) variation++;
}

/* CONTROL DE REPRODUCCIÓN Y EVENTOS */
async function toggleAudio(){
    await initAudio();
    const btn = document.getElementById('playAudioBtn');
    if(isPlaying){
        isPlaying = false;
        clearInterval(musicTimer);
        musicTimer = null;
        btn.textContent = '▶️ Reproducir';
        btn.classList.remove('active');
        document.getElementById('musicStatus').textContent = '🎵 Música pausada';
        return;
    }
    isPlaying = true;
    step = 0;
    variation++;
    btn.textContent = '⏸️ Pausar';
    btn.classList.add('active');
    startMusicTimer();
    document.getElementById('musicStatus').textContent = '🎶 Reproduciendo: ' + document.getElementById('styleSelect').selectedOptions[0].text;
}

function startMusicTimer(){
    clearInterval(musicTimer);
    const style = styles[currentStyle];
    const interval = (60000 / style.bpm) / 4; // Secuenciador de corcheas (1/16th)
    playMusicStep();
    musicTimer = setInterval(playMusicStep, interval);
}

function changeStyle(){
    currentStyle = document.getElementById('styleSelect').value;
    variation++;
    step = 0;
    if(isPlaying){
        startMusicTimer();
        document.getElementById('musicStatus').textContent = '🎶 Reproduciendo: ' + document.getElementById('styleSelect').selectedOptions[0].text;
    }
}

async function newVariation(){
    await initAudio();
    variation++;
    step = 0;
    if(isPlaying){
        startMusicTimer();
    } else {
        const style = styles[currentStyle];
        if(style.chords[0]) playPadSynth(style.chords[0], 2.0, 0.03);
    }
    document.getElementById('musicStatus').textContent = '✨ Nueva variación armonizada';
}

/* GENERADOR DE SONIDOS AMBIENTALES NATURALES */
function createNoiseBuffer(seconds = 2){
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * seconds, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
}

function getBaseGain(type){
    const gains = {rain:0.12, ocean:0.15, fire:0.08, night:0.02, wind:0.14, river:0.12, birds:0.10, storm:0.14};
    return gains[type] || 0.08;
}

async function toggleAmbientNoise(type, active){
    await initAudio();
    if(!active){
        const node = ambientNodes[type];
        if(node){
            try { node.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5); } catch(e){}
            setTimeout(() => {
                try {
                    if(node.source) node.source.stop();
                    if(node.interval) clearInterval(node.interval);
                } catch(e){}
                ambientNodes[type] = null;
            }, 550);
        }
        return;
    }

    const slider = document.getElementById(type + 'Vol');
    const volume = parseFloat(slider.value) * getBaseGain(type);

    if(type === 'birds'){
        const gain = audioCtx.createGain();
        gain.gain.value = volume;
        gain.connect(masterBus);

        const interval = setInterval(() => {
            if(Math.random() < 0.5) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            const startFreq = 1800 + Math.random() * 1200;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(startFreq * 1.3, audioCtx.currentTime + 0.1);

            g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(volume * 0.7, audioCtx.currentTime + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);

            osc.connect(g);
            g.connect(gain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.28);
        }, 900);

        ambientNodes[type] = {source:null, gain, interval};
        return;
    }

    const source = audioCtx.createBufferSource();
    source.buffer = createNoiseBuffer(2);
    source.loop = true;

    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    if(type === 'rain') { filter.type = 'lowpass'; filter.frequency.value = 1600; }
    else if(type === 'ocean') { filter.type = 'bandpass'; filter.frequency.value = 450; filter.Q.value = 0.6; }
    else if(type === 'fire') { filter.type = 'bandpass'; filter.frequency.value = 850; filter.Q.value = 0.7; }
    else if(type === 'night') { filter.type = 'highpass'; filter.frequency.value = 3800; }
    else if(type === 'wind') { filter.type = 'bandpass'; filter.frequency.value = 220; filter.Q.value = 0.8; }
    else if(type === 'river') { filter.type = 'lowpass'; filter.frequency.value = 850; }
    else if(type === 'storm') { filter.type = 'lowpass'; filter.frequency.value = 280; }

    gain.gain.value = 0.0001;
    gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.6);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterBus);
    source.start();

    ambientNodes[type] = {source, gain};
}

function updateAmbientVolume(type, value){
    if(ambientNodes[type] && ambientNodes[type].gain){
        ambientNodes[type].gain.gain.setTargetAtTime(parseFloat(value) * getBaseGain(type), audioCtx.currentTime, 0.03);
    }
}

/* EJERCICIO DE RESPIRACIÓN 4-7-8 */
let isBreathing = false;
let breathingTimeout = null;
let breathingCountdownTimeout = null;
let breathingCycleNumber = 0;

function clearBreathingTimers(){
    clearTimeout(breathingTimeout);
    clearTimeout(breathingCountdownTimeout);
    breathingTimeout = null;
    breathingCountdownTimeout = null;
}

function speakBreathing(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'es-AR';
    utterance.rate = 0.88;
    utterance.pitch = 1;
    window.speechSynthesis.speak(utterance);
}

function stopBreathing(){
    isBreathing = false;
    clearBreathingTimers();
    if('speechSynthesis' in window) window.speechSynthesis.cancel();

    const btn = document.getElementById('breathingBtn');
    const box = document.getElementById('breathingBox');
    const circle = document.getElementById('breathingCircle');
    const text = document.getElementById('breathingText');
    const counter = document.getElementById('breathingCounter');

    if(btn){
        btn.textContent = 'Comenzar Respiración 4-7-8 🫁';
        btn.classList.remove('breathing-stop');
        btn.classList.add('breathing-start');
    }
    if(circle){
        circle.className = 'breathing-circle prepare';
        circle.textContent = 'Preparado';
    }
    if(text) text.textContent = 'Ejercicio detenido';
    if(counter) counter.textContent = 'Cuando estés listo, podés comenzar nuevamente.';

    setTimeout(() => {
        if(!isBreathing && box) box.style.display = 'none';
    }, 900);
}

function openBreathingExercise(){
    if(isBreathing){
        stopBreathing();
        return;
    }
    isBreathing = true;
    breathingCycleNumber = 0;

    const btn = document.getElementById('breathingBtn');
    const box = document.getElementById('breathingBox');
    const circle = document.getElementById('breathingCircle');
    const text = document.getElementById('breathingText');
    const counter = document.getElementById('breathingCounter');

    clearBreathingTimers();
    box.style.display = 'block';

    btn.textContent = 'Detener Respiración ⏹️';
    btn.classList.remove('breathing-start');
    btn.classList.add('breathing-stop');

    circle.className = 'breathing-circle prepare';
    circle.textContent = 'Preparáte';
    text.textContent = 'Vamos a comenzar...';
    counter.textContent = 'Preparación';

    speakBreathing('Vamos a comenzar el ejercicio de respiración cuatro, siete, ocho. Busca una posición cómoda y relaja los hombros.');

    breathingTimeout = setTimeout(() => {
        if(!isBreathing) return;
        speakBreathing('Comenzamos.');
        breathingTimeout = setTimeout(() => {
            if(isBreathing) breathingCycle();
        }, 1200);
    }, 3000);
}

function breathingCycle(){
    if(!isBreathing) return;
    breathingCycleNumber++;

    breathingPhase('inhale', 'Inhalá', 'Inhalá lentamente por la nariz.', 4, () => {
        if(!isBreathing) return;
        breathingPhase('hold', 'Mantené', 'Mantené el aire suavemente.', 7, () => {
            if(!isBreathing) return;
            breathingPhase('exhale', 'Exhalá', 'Exhalá lentamente por la boca.', 8, () => {
                if(!isBreathing) return;
                const counter = document.getElementById('breathingCounter');
                const text = document.getElementById('breathingText');
                const circle = document.getElementById('breathingCircle');

                circle.className = 'breathing-circle prepare';
                circle.textContent = 'Bien hecho';
                text.textContent = 'Ciclo ' + breathingCycleNumber + ' completado 🌿';
                counter.textContent = 'Preparando el siguiente ciclo...';

                speakBreathing('Muy bien. Relaja el cuerpo.');

                breathingTimeout = setTimeout(() => {
                    if(isBreathing) breathingCycle();
                }, 2500);
            });
        });
    });
}

function breathingPhase(phase, title, voiceText, seconds, callback){
    if(!isBreathing) return;
    const circle = document.getElementById('breathingCircle');
    const text = document.getElementById('breathingText');

    circle.className = 'breathing-circle ' + phase;
    circle.textContent = title;
    text.textContent = title;

    speakBreathing(voiceText);
    breathingCountdown(seconds, callback);
}

function breathingCountdown(seconds, callback){
    if(!isBreathing) return;
    let remaining = seconds;
    const counter = document.getElementById('breathingCounter');
    counter.textContent = remaining + ' segundos';

    function tick(){
        if(!isBreathing) return;
        remaining--;
        if(remaining <= 0){
            callback();
            return;
        }
        counter.textContent = remaining + ' segundos';
        breathingCountdownTimeout = setTimeout(tick, 1000);
    }
    breathingCountdownTimeout = setTimeout(tick, 1000);
}

let mediaRecorder = null;
let audioChunks = [];

document.getElementById('recordBtn').addEventListener('click', toggleRecording);

async function toggleRecording(){
    const button = document.getElementById('recordBtn');
    const playback = document.getElementById('audioPlayback');

    if(mediaRecorder && mediaRecorder.state === 'recording'){
        mediaRecorder.stop();
        button.textContent = 'Grabar Audio';
        return;
    }

    try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        let mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';

        mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
            if(event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            stream.getTracks().forEach(track => track.stop());
            const blob = new Blob(audioChunks, {type: mediaRecorder.mimeType});
            const reader = new FileReader();
            reader.onloadend = () => {
                currentBase64Audio = reader.result;
                playback.src = currentBase64Audio;
                playback.style.display = 'block';
            };
            reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        button.textContent = 'Detener Grabación ⏹️';
    } catch(error){
        alert('No se pudo acceder al micrófono. Verificá los permisos del navegador.');
    }
}

function deleteItem(storageKey, index){
    const items = JSON.parse(localStorage.getItem(storageKey)) || [];
    if(!confirm('¿Querés eliminar este registro?')) return;

    items.splice(index, 1);
    localStorage.setItem(storageKey, JSON.stringify(items));

    if(storageKey === 'emotionEntries') loadEntries();
    if(storageKey === 'gratitudeEntries') loadGratitude();
    if(storageKey === 'strategyEntries') loadStrategies();
    if(storageKey === 'microexpressionEntries') loadMicroexpressions();
}

function loadEntries(){
    const list = document.getElementById('entriesList');
    const filter = document.getElementById('filterChildSelect').value;
    list.innerHTML = '';

    const entries = JSON.parse(localStorage.getItem('emotionEntries')) || [];
    entries.forEach((item, index) => {
        const child = item.child || 'General';
        if(filter !== 'Todos' && child !== filter) return;

        const li = document.createElement('li');
        const badge = document.createElement('span');
        badge.className = 'badge-child';
        badge.textContent = '👤 ' + child;
        li.appendChild(badge);
        li.appendChild(document.createElement('br'));

        const strong = document.createElement('strong');
        strong.textContent = item.date + ' - Emoción: ' + item.emotion;
        li.appendChild(strong);
        li.appendChild(document.createElement('br'));

        if(item.note) li.appendChild(document.createTextNode(item.note));

        if(item.photo){
            const img = document.createElement('img');
            img.src = item.photo;
            img.className = 'entry-img';
            li.appendChild(img);
        }

        if(item.audio){
            const audio = document.createElement('audio');
            audio.src = item.audio;
            audio.controls = true;
            audio.style.width = '100%';
            audio.style.marginTop = '8px';
            li.appendChild(audio);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.textContent = 'Eliminar';
        deleteBtn.onclick = () => deleteItem('emotionEntries', index);

        li.appendChild(deleteBtn);
        list.appendChild(li);
    });
}

function escapeHTML(text){
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}
