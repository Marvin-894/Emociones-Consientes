/* =========================================================
   STORAGE
   ========================================================= */

function getStorage(key) {

    try {

        const value =
            localStorage.getItem(key);

        if (!value) {
            return [];
        }

        const parsed =
            JSON.parse(value);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (error) {

        console.error(
            'Error leyendo almacenamiento:',
            error
        );

        return [];
    }
}


function setStorage(key, data) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(data)
        );

        return true;

    } catch (error) {

        console.error(
            'Error guardando datos:',
            error
        );

        alert(
            'No se pudieron guardar los datos. ' +
            'Es posible que el almacenamiento de la aplicación esté lleno.'
        );

        return false;
    }
}


/* =========================================================

function getEntryDate(entry) {

    if (!entry) {
        return null;
    }

    if (entry.timestamp) {

        const date =
            new Date(entry.timestamp);

        if (!isNaN(date.getTime())) {
            return date;
        }
    }

    if (entry.date) {

        const date =
            new Date(entry.date);

        if (!isNaN(date.getTime())) {
            return date;
        }
    }

    return null;
}


function isWithinLast7Days(entry) {

    const date =
        getEntryDate(entry);

    if (!date) {
        return false;
    }

    const now =
        new Date();

    const start =
        new Date();

    start.setHours(
        0,
        0,
        0,
        0
    );

    start.setDate(
        start.getDate() - 6
    );

    return (
        date >= start &&
        date <= now
    );
}


function formatDate(
    date = new Date()
) {

    return date.toLocaleString(
        'es-AR',
        {
            dateStyle: 'short',
            timeStyle: 'short'
        }
    );
}


/* =========================================================

async function initAudio() {

    try {

        if (!audioCtx) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {

                alert(
                    'Este dispositivo no permite reproducir audio.'
                );

                return false;
            }

            audioCtx =
                new AudioContext();
        }

        if (
            audioCtx.state ===
            'suspended'
        ) {

            await audioCtx.resume();
        }

        return true;

    } catch (error) {

        console.error(
            'Error inicializando audio:',
            error
        );

        alert(
            'No se pudo iniciar el sistema de audio.'
        );

        return false;
    }
}


function playTone(
    freq,
    duration,
    type = 'sine',
    gainVal = 0.05
) {

    if (
        !freq ||
        !audioCtx
    ) {
        return;
    }

    try {

        const osc =
            audioCtx.createOscillator();

        const gainNode =
            audioCtx.createGain();

        const filter =
            audioCtx.createBiquadFilter();

        const now =
            audioCtx.currentTime;

        osc.type =
            type;

        osc.frequency.setValueAtTime(
            freq,
            now
        );

        filter.type =
            'lowpass';

        filter.frequency.setValueAtTime(
            1600,
            now
        );

        gainNode.gain.setValueAtTime(
            0.001,
            now
        );

        gainNode.gain.linearRampToValueAtTime(
            gainVal,
            now + 0.05
        );

        gainNode.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        osc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(
            audioCtx.destination
        );

        osc.start();

        osc.stop(
            now + duration
        );

    } catch (error) {

        console.error(
            'Error reproduciendo tono:',
            error
        );
    }
}


function playStep() {

    if (!isPlaying) {
        return;
    }

    const style =
        styles[currentStyle];

    if (!style) {
        return;
    }

    const chordIndex =
        Math.floor(step / 4) %
        style.chords.length;

    if (
        step % 4 === 0 &&
        style.chords[chordIndex]
    ) {

        style.chords[chordIndex]
            .forEach(note => {

                playTone(
                    note,
                    2.5,
                    style.wave,
                    0.025
                );

            });
    }

    const melodyNote =
        style.melody[
            step %
            style.melody.length
        ];

    if (melodyNote) {

        playTone(
            melodyNote,
            0.8,
            'sine',
            0.035
        );
    }

    step++;
}


function stopMusicTimer() {

    if (timerId) {

        clearInterval(
            timerId
        );

        timerId = null;
    }
}


function startMusicTimer() {

    stopMusicTimer();

    const style =
        styles[currentStyle];

    if (!style) {
        return;
    }

    timerId =
        setInterval(
            playStep,
            style.tempo
        );
}


function startAutoSwitchTimer() {

    stopAutoSwitchTimer();

    autoSwitchInterval =
        setInterval(
            () => {

                if (isPlaying) {
                    skipToNextStyle();
                }

            },
            120000
        );
}


function stopAutoSwitchTimer() {

    if (autoSwitchInterval) {

        clearInterval(
            autoSwitchInterval
        );

        autoSwitchInterval =
            null;
    }
}


async function toggleAudio() {

    const initialized =
        await initAudio();

    if (!initialized) {
        return;
    }

    const btn =
        document.getElementById(
            'playAudioBtn'
        );

    if (isPlaying) {

        isPlaying = false;

        stopMusicTimer();
        stopAutoSwitchTimer();

        if (btn) {

            btn.innerText =
                'Reproducir Música 🎵';

            btn.classList.remove(
                'active'
            );
        }

    } else {

        isPlaying = true;

        step = 0;

        if (btn) {

            btn.innerText =
                'Pausar Música ⏸️';

            btn.classList.add(
                'active'
            );
        }

        playStep();

        startMusicTimer();
        startAutoSwitchTimer();
    }
}


function skipToNextStyle() {

    const select =
        document.getElementById(
            'styleSelect'
        );

    const keys =
        Object.keys(styles);

    const currentIndex =
        keys.indexOf(
            currentStyle
        );

    const nextIndex =
        (
            currentIndex + 1
        ) %
        keys.length;

    currentStyle =
        keys[nextIndex];

    if (select) {
        select.value =
            currentStyle;
    }

    step = 0;

    if (isPlaying) {

        startMusicTimer();
        playStep();
    }
}


function changeStyleManual() {

    const select =
        document.getElementById(
            'styleSelect'
        );

    if (!select) {
        return;
    }

    if (!styles[select.value]) {
        return;
    }

    currentStyle =
        select.value;

    step = 0;

    if (isPlaying) {

        startMusicTimer();
        playStep();
    }
}


/* =========================================================
   SONIDOS AMBIENTALES
   ========================================================= */

function createWhiteNoiseBuffer() {

    if (!audioCtx) {
        return null;
    }

    const bufferSize =
        Math.floor(
            audioCtx.sampleRate * 2
        );

    const buffer =
        audioCtx.createBuffer(
            1,
            bufferSize,
            audioCtx.sampleRate
        );

    const output =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        output[i] =
            Math.random() * 2 - 1;
    }

    return buffer;
}


function getBaseGain(type) {

    const gains = {

        rain: 0.15,
        ocean: 0.20,
        fire: 0.10,
        night: 0.05,
        wind: 0.25,
        river: 0.18,
        birds: 0.80,
        storm: 0.30

    };

    return gains[type] || 0.1;
}


async function toggleAmbientNoise(
    type,
    active
) {

    if (
        !Object.prototype.hasOwnProperty.call(
            ambientNodes,
            type
        )
    ) {
        return;
    }

    const initialized =
        await initAudio();

    if (!initialized) {
        return;
    }


    /* DESACTIVAR */

    if (!active) {

        const node =
            ambientNodes[type];

        if (!node) {
            return;
        }

        if (node.interval) {

            clearInterval(
                node.interval
            );

            node.interval = null;
        }

        if (node.gain) {

            try {

                node.gain.gain.cancelScheduledValues(
                    audioCtx.currentTime
                );

                node.gain.gain.setTargetAtTime(
                    0.0001,
                    audioCtx.currentTime,
                    0.15
                );

            } catch (error) {}
        }

        setTimeout(
            () => {

                try {

                    if (node.source) {
                        node.source.stop();
                        node.source.disconnect();
                    }

                    if (node.gain) {
                        node.gain.disconnect();
                    }

                } catch (error) {}

                ambientNodes[type] =
                    null;

            },
            500
        );

        return;
    }


    /* EVITAR DUPLICADOS */

    if (ambientNodes[type]) {
        return;
    }


    /* PÁJAROS */

    if (type === 'birds') {

        const gain =
            audioCtx.createGain();

        const volume =
            document.getElementById(
                'birdsVol'
            );

        const value =
            parseFloat(
                volume?.value || 0.5
            );

        gain.gain.value =
            value *
            getBaseGain(type);

        gain.connect(
            audioCtx.destination
        );

        const birdInterval =
            setInterval(
                () => {

                    if (
                        !audioCtx ||
                        audioCtx.state !==
                            'running'
                    ) {
                        return;
                    }

                    if (
                        Math.random() >
                        0.4
                    ) {

                        try {

                            const osc =
                                audioCtx.createOscillator();

                            const birdGain =
                                audioCtx.createGain();

                            const startFreq =
                                2000 +
                                Math.random() *
                                1500;

                            const now =
                                audioCtx.currentTime;

                            osc.type =
                                'sine';

                            osc.frequency.setValueAtTime(
                                startFreq,
                                now
                            );

                            osc.frequency.linearRampToValueAtTime(
                                startFreq + 800,
                                now + 0.1
                            );

                            birdGain.gain.setValueAtTime(
                                0.001,
                                now
                            );

                            birdGain.gain.linearRampToValueAtTime(
                                0.04,
                                now + 0.05
                            );

                            birdGain.gain.exponentialRampToValueAtTime(
                                0.001,
                                now + 0.2
                            );

                            osc.connect(
                                birdGain
                            );

                            birdGain.connect(
                                gain
                            );

                            osc.start();

                            osc.stop(
                                now + 0.2
                            );

                        } catch (error) {}
                    }

                },
                900
            );

        ambientNodes[type] = {

            source: null,
            gain: gain,
            interval: birdInterval

        };

        return;
    }


    /* RUIDO */

    const buffer =
        createWhiteNoiseBuffer();

    if (!buffer) {
        return;
    }

    const noiseSource =
        audioCtx.createBufferSource();

    noiseSource.buffer =
        buffer;

    noiseSource.loop =
        true;

    const filter =
        audioCtx.createBiquadFilter();

    const gain =
        audioCtx.createGain();


    switch (type) {

        case 'rain':

            filter.type =
                'lowpass';

            filter.frequency.value =
                1000;

            break;


        case 'ocean':

            filter.type =
                'bandpass';

            filter.frequency.value =
                400;

            filter.Q.value =
                1;

            break;


        case 'fire':

            filter.type =
                'bandpass';

            filter.frequency.value =
                800;

            filter.Q.value =
                1;

            break;


        case 'night':

            filter.type =
                'highpass';

            filter.frequency.value =
                4000;

            break;


        case 'wind':

            filter.type =
                'bandpass';

            filter.frequency.value =
                250;

            filter.Q.value =
                3;

            break;


        case 'river':

            filter.type =
                'lowpass';

            filter.frequency.value =
                600;

            break;


        case 'storm':

            filter.type =
                'lowpass';

            filter.frequency.value =
                180;

            break;
    }


    const slider =
        document.getElementById(
            type + 'Vol'
        );

    const sliderValue =
        parseFloat(
            slider?.value || 0.5
        );

    const targetGain =
        sliderValue *
        getBaseGain(type);


    const now =
        audioCtx.currentTime;

    gain.gain.setValueAtTime(
        0.001,
        now
    );

    gain.gain.linearRampToValueAtTime(
        targetGain,
        now + 0.3
    );


    noiseSource.connect(
        filter
    );

    filter.connect(
        gain
    );

    gain.connect(
        audioCtx.destination
    );

    noiseSource.start();


    ambientNodes[type] = {

        source: noiseSource,
        gain: gain

    };
}


function updateVolume(
    type,
    value
) {

    const node =
        ambientNodes[type];

    if (
        !node ||
        !node.gain ||
        !audioCtx
    ) {
        return;
    }

    const numericValue =
        parseFloat(value);

    if (
        isNaN(numericValue)
    ) {
        return;
    }

    const targetGain =
        numericValue *
        getBaseGain(type);

    try {

        node.gain.gain.setTargetAtTime(
            targetGain,
            audioCtx.currentTime,
            0.05
        );

    } catch (error) {}
}


/* =========================================================
   TEXTO A VOZ
   ========================================================= */

function speakText(
    text,
    options = {}
) {

    if (
        !text ||
        !('speechSynthesis' in window)
    ) {
        return false;
    }

    try {

        const {

            cancel = true,
            rate = 0.9,
            pitch = 1,
            volume = 1

        } = options;

        if (cancel) {

            window.speechSynthesis.cancel();
        }

        const utterance =
            new SpeechSynthesisUtterance(
                text
            );

        utterance.lang =
            'es-AR';

        utterance.rate =
            rate;

        utterance.pitch =
            pitch;

        utterance.volume =
            volume;

        window.speechSynthesis.speak(
            utterance
        );

        return true;

    } catch (error) {

        console.error(
            'Error en voz:',
            error
        );

        return false;
    }
}

function selectEmotion(

    message,
    element
) {

    selectedEmotionValue =
        emotion;

    document
        .querySelectorAll(
            '.buttons-grid .btn'
        )
        .forEach(
            btn => {

                btn.classList.remove(
                    'selected'
                );

            }
        );

    if (element) {

        element.classList.add(
            'selected'
        );
    }

    speakText(
        message
    );
}

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                event => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            const MAX_WIDTH =
                                1280;

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if (
                                width >
                                MAX_WIDTH
                            ) {

                                height =
                                    Math.round(
                                        height *
                                        MAX_WIDTH /
                                        width
                                    );

                                width =
                                    MAX_WIDTH;
                            }


                            const canvas =
                                document.createElement(
                                    'canvas'
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    '2d'
                                );

                            if (!ctx) {

                                reject(
                                    new Error(
                                        'No se pudo crear el canvas.'
                                    )
                                );

                                return;
                            }


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    'image/jpeg',
                                    0.70
                                )
                            );
                        };


                    img.onerror =
                        () => {

                            reject(
                                new Error(
                                    'Imagen inválida.'
                                )
                            );

                        };


                    img.src =
                        event.target.result;
                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            'No se pudo leer la imagen.'
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );
        }
    );
}

/* =========================================================
   GRABACIÓN DE AUDIO
   ========================================================= */

async function toggleRecording() {

    const recordBtn =
        document.getElementById(
            'recordBtn'
        );

    const audioPlayback =
        document.getElementById(
            'audioPlayback'
        );


    /* DETENER */

    if (
        mediaRecorder &&
        mediaRecorder.state ===
            'recording'
    ) {

        try {

            mediaRecorder.stop();

        } catch (error) {

            console.error(
                error
            );
        }

        if (recordBtn) {

            recordBtn.innerText =
                'Procesando audio...';
        }

        return;
    }


    /* SOPORTE */

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            'El micrófono no está disponible. ' +
            'Verifica los permisos de la aplicación.'
        );

        return;
    }


    if (
        typeof MediaRecorder ===
        'undefined'
    ) {

        alert(
            'Este dispositivo no admite grabación de audio.'
        );

        return;
    }


    try {

        audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        let mimeType =
            '';


        const possibleTypes = [

            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/mp4',
            'audio/ogg;codecs=opus',
            'audio/ogg'

        ];


        for (
            const type
            of possibleTypes
        ) {

            try {

                if (
                    MediaRecorder.isTypeSupported(
                        type
                    )
                ) {

                    mimeType =
                        type;

                    break;
                }

            } catch (error) {}
        }


        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    audioStream,
                    {
                        mimeType:
                            mimeType
                    }
                )
                : new MediaRecorder(
                    audioStream
                );


        audioChunks =
            [];


        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            () => {

                try {

                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    mimeType ||
                                    'audio/webm'
                            }
                        );


                    if (
                        blob.size ===
                        0
                    ) {

                        throw new Error(
                            'El audio está vacío.'
                        );
                    }


                    const reader =
                        new FileReader();


                    reader.onloadend =
                        () => {

                            currentBase64Audio =
                                reader.result;


                            if (
                                audioPlayback
                            ) {

                                audioPlayback.src =
                                    currentBase64Audio;

                                audioPlayback.style.display =
                                    'block';
                            }


                            if (
                                recordBtn
                            ) {

                                recordBtn.innerText =
                                    'Grabar Audio 🎙️';
                            }
                        };


                    reader.onerror =
                        () => {

                            if (
                                recordBtn
                            ) {

                                recordBtn.innerText =
                                    'Grabar Audio 🎙️';
                            }

                            alert(
                                'No se pudo procesar el audio.'
                            );
                        };


                    reader.readAsDataURL(
                        blob
                    );


                } catch (error) {

                    console.error(
                        'Procesando audio:',
                        error
                    );

                    if (
                        recordBtn
                    ) {

                        recordBtn.innerText =
                            'Grabar Audio 🎙️';
                    }
                }


                if (audioStream) {

                    audioStream
                        .getTracks()
                        .forEach(
                            track => {

                                try {
                                    track.stop();
                                } catch (error) {}

                            }
                        );

                    audioStream =
                        null;
                }

                mediaRecorder =
                    null;
            };


        mediaRecorder.onerror =
            event => {

                console.error(
                    'MediaRecorder:',
                    event
                );

                if (
                    recordBtn
                ) {

                    recordBtn.innerText =
                        'Grabar Audio 🎙️';
                }
            };


        mediaRecorder.start();


        if (recordBtn) {

            recordBtn.innerText =
                'Detener Grabación ⏹️';
        }


    } catch (error) {

        console.error(
            'Micrófono:',
            error
        );


        if (audioStream) {

            audioStream
                .getTracks()
                .forEach(
                    track => {

                        try {
                            track.stop();
                        } catch (error) {}

                    }
                );

            audioStream =
                null;
        }


        alert(
            'No se pudo acceder al micrófono.\n\n' +
            'Verifica que la aplicación tenga permiso para utilizarlo.'
        );


        if (recordBtn) {

            recordBtn.innerText =
                'Grabar Audio 🎙️';
        }
    }
}

/* =========================================================
   SEGURIDAD HTML
   ========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }


    return String(value)
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );
}


/* =========================================================
   HISTORIAL
   ========================================================= */

function deleteItem(
    storageKey,
    index
) {

    const items =
        getStorage(
            storageKey
        );


    if (
        index < 0 ||
        index >= items.length
    ) {
        return;
    }


    if (
        !confirm(
            '¿Seguro que deseas eliminar este registro?'
        )
    ) {
        return;
    }


    items.splice(
        index,
        1
    );


    if (
        !setStorage(
            storageKey,
            items
        )
    ) {
        return;
    }


    switch (storageKey) {

        case 'emotionEntries':

            loadEntries();
            updateWeeklyChart();

            break;


        case 'gratitudeEntries':

            loadGratitude();

            break;


        case 'strategyEntries':

            loadStrategies();

            break;


        case 'microexpressionEntries':

            loadMicroexpressions();

            break;


        case 'archivedWeeks':

            loadArchives();

            break;
    }
}

        );

/* =========================================================
   RENDERIZADO
   ========================================================= */

function renderList(
    listId,
    storageKey,
    createContentFn
) {

    const list =
        document.getElementById(
            listId
        );


    if (!list) {
        return;
    }


    list.innerHTML =
        '';


    const items =
        getStorage(
            storageKey
        );


    if (
        items.length ===
        0
    ) {

        const empty =
            document.createElement(
                'li'
            );


        empty.innerText =
            'Todavía no hay registros.';


        list.appendChild(
            empty
        );


        return;
    }


    items
        .slice()
        .reverse()
        .forEach(
            (
                item,
                reverseIndex
            ) => {

                const realIndex =
                    items.length -
                    1 -
                    reverseIndex;


                const li =
                    document.createElement(
                        'li'
                    );


                li.innerHTML =
                    createContentFn(
                        item
                    );


                const deleteBtn =
                    document.createElement(
                        'button'
                    );


                deleteBtn.className =
                    'btn-delete';

                deleteBtn.innerText =
                    'Eliminar';

                deleteBtn.type =
                    'button';


                deleteBtn.onclick =
                    () =>
                        deleteItem(
                            storageKey,
                            realIndex
                        );


                li.appendChild(
                    deleteBtn
                );


                list.appendChild(
                    li
                );
            }
        );
}

/* =========================================================
   GRÁFICO SEMANAL
   ========================================================= */

function updateWeeklyChart() {

    const chartContainer =
        document.getElementById(
            'weeklyChart'
        );

    const summaryBox =
        document.getElementById(
            'weeklySummary'
        );


    if (
        !chartContainer ||
        !summaryBox
    ) {
        return;
    }


    chartContainer.innerHTML =
        '';


    const allEntries =
        getStorage(
            'emotionEntries'
        );


    const entries =
        allEntries.filter(
            isWithinLast7Days
        );


    if (
        entries.length ===
        0
    ) {

        chartContainer.innerHTML =
            '<p style="margin:auto;">' +
            'No hay registros emocionales de los últimos 7 días.' +
            '</p>';


        summaryBox.innerText =
            'Registra tus emociones para generar el balance semanal.';


        return;
    }


    const emotionCounts =
        {};


    entries.forEach(
        entry => {

            if (
                entry.emotion &&
                entry.emotion !==
                    'No especificada'
            ) {

                emotionCounts[
                    entry.emotion
                ] =
                    (
                        emotionCounts[
                            entry.emotion
                        ] ||
                        0
                    ) + 1;
            }
        }
    );


    const total =
        Object.values(
            emotionCounts
        ).reduce(
            (
                a,
                b
            ) =>
                a + b,
            0
        );


    if (
        total ===
        0
    ) {

        summaryBox.innerText =
            'No hay emociones registradas esta semana.';

        return;
    }


    let maxEmotion =
        '';

    let maxCount =
        0;


    Object.entries(
        emotionCounts
    ).forEach(
        (
            [
                emotion,
                count
            ]
        ) => {

            if (
                count >
                maxCount
            ) {

                maxCount =
                    count;

                maxEmotion =
                    emotion;
            }
        }
    );


    Object.entries(
        emotionCounts
    ).forEach(
        (
            [
                emotion,
                count
            ]
        ) => {

            const heightPct =
                Math.max(
                    5,
                    (
                        count /
                        total
                    ) *
                    100
                );


            const wrapper =
                document.createElement(
                    'div'
                );


            wrapper.className =
                'chart-bar-wrapper';


            const bar =
                document.createElement(
                    'div'
                );


            bar.className =
                'chart-bar';


            bar.style.height =
                `${heightPct}%`;


            bar.title =
                `${emotion}: ${count}`;


            const label =
                document.createElement(
                    'span'
                );


            label.className =
                'chart-label';


            label.innerText =
                String(
                    emotion
                ).substring(
                    0,
                    5
                );


            wrapper.appendChild(
                bar
            );

            wrapper.appendChild(
                label
            );


            chartContainer.appendChild(
                wrapper
            );
        }
    );


    const dominantPct =
        Math.round(
            (
                maxCount /
                total
            ) *
            100
        );


    summaryBox.innerHTML =
        `Estado dominante: <strong>` +
        `${escapeHTML(maxEmotion)}` +
        `</strong> (${dominantPct}%). ` +
        `Registros de los últimos 7 días: ${total}.`;
}


/* =========================================================
   ARCHIVAR SEMANA
   ========================================================= */

function closeAndArchiveWeek() {

    const allEntries =
        getStorage(
            'emotionEntries'
        );


    const weeklyEntries =
        allEntries.filter(
            isWithinLast7Days
        );


    if (
        weeklyEntries.length ===
        0
    ) {

        alert(
            'No hay registros de los últimos 7 días para archivar.'
        );

        return;
    }


    if (
        !confirm(
            '¿Deseas cerrar y archivar los registros de los últimos 7 días?'
        )
    ) {
        return;
    }


    const summaryElement =
        document.getElementById(
            'weeklySummary'
        );


    const summary =
        summaryElement
            ? summaryElement.innerText
            : 'Resumen semanal';


    const now =
        new Date();


    const archiveItem = {

        date:
            now.toLocaleDateString(
                'es-AR'
            ),

        timestamp:
            now.toISOString(),

        summary:
            summary,

        entriesCount:
            weeklyEntries.length,

        entries:
            weeklyEntries

    };


    const archives =
        getStorage(
            'archivedWeeks'
        );


    archives.push(
        archiveItem
    );


    if (
        !setStorage(
            'archivedWeeks',
            archives
        )
    ) {
        return;
    }


    const remainingEntries =
        allEntries.filter(
            entry =>
                !isWithinLast7Days(
                    entry
                )
        );


    if (
        !setStorage(
            'emotionEntries',
            remainingEntries
        )
    ) {
        return;
    }


    loadEntries();

    loadArchives();

    updateWeeklyChart();


    alert(
        '¡Semana archivada con éxito! 📦'
    );
}


/* =========================================================
   EXPORTAR DATOS
   ========================================================= */

function exportDataJSON() {

    const data = {

        version:
            2,

        exportedAt:
            new Date().toISOString(),

        emotionEntries:
            getStorage(
                'emotionEntries'
            ),

        gratitudeEntries:
            getStorage(
                'gratitudeEntries'
            ),

        strategyEntries:
            getStorage(
                'strategyEntries'
            ),

        microexpressionEntries:
            getStorage(
                'microexpressionEntries'
            ),

        archivedWeeks:
            getStorage(
                'archivedWeeks'
            )
    };


    try {

        const jsonText =
            JSON.stringify(
                data,
                null,
                2
            );


        const blob =
            new Blob(
                [jsonText],
                {
                    type:
                        'application/json;charset=utf-8'
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const anchor =
            document.createElement(
                'a'
            );


        anchor.href =
            url;


        anchor.download =
            `respaldo_diario_${new Date()
                .toISOString()
                .slice(
                    0,
                    10
                )}.json`;


        document.body.appendChild(
            anchor
        );


        anchor.click();


        document.body.removeChild(
            anchor
        );


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


    } catch (error) {

        console.error(
            error
        );

        alert(
            'No se pudo crear el respaldo.'
        );
    }
}


/* =========================================================
   IMPORTAR DATOS
   ========================================================= */

function importDataJSON(event) {

    const file =
        event.target.files?.[0];


    if (!file) {
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function (e) {

            try {

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !imported ||
                    typeof imported !==
                        'object' ||
                    Array.isArray(imported)
                ) {

                    throw new Error(
                        'Formato inválido'
                    );
                }


                if (
                    !confirm(
                        'Esto reemplazará los datos actuales. ¿Deseas continuar?'
                    )
                ) {

                    event.target.value =
                        '';

                    return;
                }


                const keys = [

                    'emotionEntries',
                    'gratitudeEntries',
                    'strategyEntries',
                    'microexpressionEntries',
                    'archivedWeeks'

                ];


                keys.forEach(
                    key => {

                        const value =
                            Array.isArray(
                                imported[key]
                            )
                                ? imported[key]
                                : [];


                        setStorage(
                            key,
                            value
                        );
                    }
                );


                loadEntries();

                loadGratitude();

                loadStrategies();

                loadMicroexpressions();

                loadArchives();

                updateWeeklyChart();


                alert(
                    '¡Datos importados con éxito! 📤'
                );


            } catch (error) {

                console.error(
                    'Importación:',
                    error
                );

                alert(
                    'El archivo JSON no es válido.'
                );

            } finally {

                event.target.value =
                    '';
            }
        };


    reader.onerror =
        () => {

            alert(
                'No se pudo leer el archivo.'
            );

            event.target.value =
                '';
        };


    reader.readAsText(
        file
    );
}


/* =========================================================
   SOS — RESPIRACIÓN 4-7-8
   CON VOZ SINCRONIZADA
   ========================================================= */

function stopBreathing(
    cancelVoice = true
) {

    breathingActive =
        false;


    if (breathTimerId) {

        clearTimeout(
            breathTimerId
        );

        clearInterval(
            breathTimerId
        );

        breathTimerId =
            null;
    }


    if (breathStartTimeout) {

        clearTimeout(
            breathStartTimeout
        );

        breathStartTimeout =
            null;
    }


    if (
        cancelVoice &&
        'speechSynthesis' in window
    ) {

        try {

            window.speechSynthesis.cancel();

        } catch (error) {}
    }
}


function setBreathUI(
    text,
    seconds,
    scale,
    transition
) {

    const circle =
        document.getElementById(
            'breathCircle'
        );

    const timer =
        document.getElementById(
            'breathTimer'
        );


    if (circle) {

        circle.innerText =
            text;

        circle.style.transition =
            transition;

        circle.style.transform =
            `scale(${scale})`;
    }


    if (timer) {

        timer.innerText =
            seconds;
    }
}


function speakBreathInstruction(
    text
) {

    if (
        !('speechSynthesis' in window)
    ) {
        return;
    }


    try {

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        utterance.lang =
            'es-AR';

        utterance.rate =
            0.82;

        utterance.pitch =
            1;

        utterance.volume =
            1;


        window.speechSynthesis.speak(
            utterance
        );

    } catch (error) {

        console.error(
            'Voz respiración:',
            error
        );
    }
}


function runBreathingPhase(
    phase,
    duration,
    text,
    nextPhase,
    scale,
    transition
) {

    if (!breathingActive) {
        return;
    }


    let remaining =
        duration;


    setBreathUI(
        text,
        remaining,
        scale,
        transition
    );


    speakBreathInstruction(
        text === 'Inhala'
            ? 'Inhalá'
            : text === 'Mantén'
                ? 'Mantené el aire'
                : 'Exhalá lentamente'
    );


    breathTimerId =
        setInterval(
            () => {

                if (
                    !breathingActive
                ) {

                    clearInterval(
                        breathTimerId
                    );

                    breathTimerId =
                        null;

                    return;
                }


                remaining--;


                if (
                    remaining >
                    0
                ) {

                    const timer =
                        document.getElementById(
                            'breathTimer'
                        );

                    if (timer) {

                        timer.innerText =
                            remaining;
                    }

                    return;
                }


                clearInterval(
                    breathTimerId
                );

                breathTimerId =
                    null;


                if (
                    nextPhase
                ) {

                    breathStartTimeout =
                        setTimeout(
                            nextPhase,
                            100
                        );
                }

            },
            1000
        );
}


function startBreathCycle() {

    /* No cancelar la voz aquí porque
       podría cortar la instrucción */

    if (breathingActive) {
        return;
    }


    breathingActive =
        true;


    function inhale() {

        if (!breathingActive) {
            return;
        }


        runBreathingPhase(
            0,
            4,
            'Inhala',
            hold,
            1.4,
            'transform 4s linear'
        );
    }


    function hold() {

        if (!breathingActive) {
            return;
        }


        runBreathingPhase(
            1,
            7,
            'Mantén',
            exhale,
            1.4,
            'none'
        );
    }


    function exhale() {

        if (!breathingActive) {
            return;
        }


        runBreathingPhase(
            2,
            8,
            'Exhala',
            inhale,
            1,
            'transform 8s linear'
        );
    }


    inhale();
}


function openSOSModal() {

    const modal =
        document.getElementById(
            'sosModal'
        );


    if (!modal) {
        return;
    }


    stopBreathing(
        true
    );


    modal.style.display =
        'flex';


    const circle =
        document.getElementById(
            'breathCircle'
        );


    const timer =
        document.getElementById(
            'breathTimer'
        );


    if (circle) {

        circle.innerText =
            '4-7-8';

        circle.style.transition =
            'none';

        circle.style.transform =
            'scale(1)';
    }


    if (timer) {

        timer.innerText =
            '';
    }


    const introText =
        'Vamos a hacer la técnica de respiración 4-7-8. ' +
        'Primero inhalá lentamente por la nariz durante cuatro segundos. ' +
        'Después mantené el aire durante siete segundos. ' +
        'Finalmente exhalá lentamente por la boca durante ocho segundos. ' +
        'Vamos a comenzar.';


    /* =====================================================
       IMPORTANTE:
       Esperamos a que termine la introducción.
       Si el navegador no informa correctamente el evento,
       usamos un tiempo de seguridad.
       ===================================================== */

    if (
        'speechSynthesis' in window
    ) {

        try {

            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    introText
                );


            utterance.lang =
                'es-AR';

            utterance.rate =
                0.85;

            utterance.pitch =
                1;

            utterance.volume =
                1;


            let started =
                false;


            const start =
                () => {

                    if (started) {
                        return;
                    }

                    started =
                        true;

                    if (
                        breathStartTimeout
                    ) {

                        clearTimeout(
                            breathStartTimeout
                        );

                        breathStartTimeout =
                            null;
                    }

                    startBreathCycle();
                };


            utterance.onend =
                start;


            utterance.onerror =
                start;


            window.speechSynthesis.speak(
                utterance
            );


            /* Tiempo máximo de seguridad.
               No inicia inmediatamente y evita
               que el ejercicio quede bloqueado. */

            breathStartTimeout =
                setTimeout(
                    start,
                    10000
                );


        } catch (error) {

            console.error(
                'Introducción SOS:',
                error
            );

            startBreathCycle();
        }


    } else {

        /* Sin voz */

        breathStartTimeout =
            setTimeout(
                startBreathCycle,
                1500
            );
    }
}


function closeSOSModal() {

    const modal =
        document.getElementById(
            'sosModal'
        );


    if (modal) {

        modal.style.display =
            'none';
    }


    stopBreathing(
        true
    );


    setBreathUI(
        'Inhala',
        '4',
        1,
        'none'
    );
}

   CERRAR SOS TOCANDO AFUERA

document.addEventListener(

        const modal =

/* =========================================================

   ========================================================= */

document.addEventListener(
    'visibilitychange',
    () => {

        if (
            document.hidden &&
            isPlaying
        ) {

            isPlaying =
                false;


            stopMusicTimer();

            stopAutoSwitchTimer();


            const btn =
                document.getElementById(
                    'playAudioBtn'
                );


            if (btn) {

                btn.innerText =
                    'Reproducir Música 🎵';

                btn.classList.remove(
                    'active'
                );
            }
        }
    }
);


/* =========================================================
   INICIALIZACIÓN
   ========================================================= */

function initializeApp() {

    try {

        loadEntries();

        loadGratitude();

        loadStrategies();

        loadMicroexpressions();

        loadArchives();

        updateWeeklyChart();


        const styleSelect =
            document.getElementById(
                'styleSelect'
            );


        if (
            styleSelect &&
            styles[currentStyle]
        ) {

            styleSelect.value =
                currentStyle;
        }


    } catch (error) {

        console.error(
            'Error inicializando la aplicación:',
            error
        );
    }
}


if (
    document.readyState ===
    'loading'
) {

    document.addEventListener(
        'DOMContentLoaded',
        initializeApp
    );

} else {

    initializeApp();
}


/* =========================================================
   LIMPIEZA AL SALIR
   ========================================================= */

window.addEventListener(
    'beforeunload',
    () => {

        stopMusicTimer();

        stopAutoSwitchTimer();

        stopBreathing(
            true
        );


        if (audioStream) {

            audioStream
                .getTracks()
                .forEach(
                    track => {

                        try {
                            track.stop();
                        } catch (error) {}

                    }
                );

            audioStream =
                null;
        }


        Object.keys(
            ambientNodes
        ).forEach(
            type => {

                const node =
                    ambientNodes[type];


                if (!node) {
                    return;
                }


                if (node.interval) {

                    clearInterval(
                        node.interval
                    );
                }


                try {

                    if (node.source) {

                        node.source.stop();
                    }

                } catch (error) {}


                try {

                    if (node.source) {

                        node.source.disconnect();
                    }

                    if (node.gain) {

                        node.gain.disconnect();
                    }

                } catch (error) {}


                ambientNodes[type] =
                    null;
            }
        );
    }
);


/* =========================================================
   EVITAR QUE LA PÁGINA QUEDE CON LA VOZ ACTIVA
   ========================================================= */

window.addEventListener(
    'pagehide',
    () => {

        try {

            if (
                'speechSynthesis' in window
            ) {

                window.speechSynthesis.cancel();
            }

        } catch (error) {}
    }
);
